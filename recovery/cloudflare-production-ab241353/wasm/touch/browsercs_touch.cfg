//=======================================================================
// BrowserCS — kompakt mobil (aspect=0 → y koordinatları aynen uygulanır)
//=======================================================================

touch_config_file "touch.cfg"

touch_forwardzone "0.100000"
touch_sidezone "0.055000"
touch_pitch "60.000000"
touch_yaw "60.000000"
touch_grid_count "50"
touch_grid_enable "0"
touch_set_stroke 1 156 77 20 100
touch_highlight_r "1.000000"
touch_highlight_g "0.550000"
touch_highlight_b "0.200000"
touch_highlight_a "1.000000"
touch_dpad_radius "1.000000"
touch_joy_radius "1.000000"
touch_precise_amount "0.500000"
touch_move_indicator "1"
touch_setclientonly 0

touch_removeall

// Sol hareket / sağ bakış (görünmez)
touch_addbutton "move" "" "_move" 0.000000 0.000000 0.500000 1.000000 255 255 255 0 0 0
touch_addbutton "look" "" "_look" 0.500000 0.000000 1.000000 1.000000 255 255 255 0 0 0

// Sağ: ateş / zoom / zıpla / çömel — küçük kareler
touch_addbutton "attack" "touch/gfx/attack" "+attack" 0.870000 0.520000 0.970000 0.680000 255 255 255 155 0 0
touch_addbutton "attack2" "touch/gfx/attack2" "+attack2" 0.885000 0.400000 0.965000 0.505000 255 255 255 135 0 0
touch_addbutton "jump" "touch/gfx/jump" "+jump" 0.905000 0.800000 0.985000 0.920000 255 255 255 155 0 0
touch_addbutton "duck" "touch/gfx/duck" "+duck" 0.805000 0.820000 0.885000 0.940000 255 255 255 155 512 0

// Sol: reload / use
touch_addbutton "reload" "touch/gfx/reload" "+reload" 0.020000 0.640000 0.100000 0.760000 255 255 255 145 0 0
touch_addbutton "use" "touch/gfx/use" "+use" 0.020000 0.500000 0.100000 0.620000 255 255 255 145 0 0

// Buy + takım + silahlar
touch_addbutton "buy" "touch/gfx/buy" "buy" 0.455000 0.905000 0.545000 0.985000 255 255 255 160 0 0
touch_addbutton "change_team" "touch/gfx/change_team" "chooseteam" 0.015000 0.020000 0.085000 0.120000 255 255 255 135 0 0
touch_addbutton "w1" "touch/gfx/w_rifle" "slot1" 0.110000 0.020000 0.175000 0.120000 255 255 255 125 0 0
touch_addbutton "w2" "touch/gfx/w_pistol" "slot2" 0.185000 0.020000 0.250000 0.120000 255 255 255 125 0 0
touch_addbutton "w3" "touch/gfx/w_knife" "slot3" 0.260000 0.020000 0.325000 0.120000 255 255 255 125 0 0
